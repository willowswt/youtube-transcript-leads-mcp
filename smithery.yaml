startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apifyApiToken:
        type: string
        description: "Your Apify API Token (https://console.apify.com/settings/integrations)"
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['src/index.js'],
      env: { APIFY_API_TOKEN: config.apifyApiToken || '' }
    })
